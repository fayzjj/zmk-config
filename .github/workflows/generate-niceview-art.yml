name: Generate NiceView Art

on:
  workflow_dispatch:
  push:
    paths:
      - "niceview_source/**"
      - "niceview_art.json"
      - "scripts/build_niceview_art.py"
      - "requirements-niceview.txt"

permissions:
  contents: write

# Only keep the newest NiceView generation for a branch.
# If several source-image commits arrive quickly, the older run is cancelled
# instead of racing the newer run for the same main branch.
concurrency:
  group: niceview-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-niceview.txt

      - name: Convert RAW images to NiceView 1-bit art
        run: python scripts/build_niceview_art.py

      - name: Upload generated previews
        uses: actions/upload-artifact@v4
        with:
          name: niceview-generated-preview
          path: niceview_generated_preview/
          if-no-files-found: error

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- \
            boards/shields/nice_view_art/art.c \
            boards/shields/nice_view_art/art_frames.h \
            niceview_generated_preview; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            boards/shields/nice_view_art/art.c \
            boards/shields/nice_view_art/art_frames.h \
            niceview_generated_preview

          git commit -m "Generate NiceView 1-bit art and previews"

          # main may have moved while image conversion was running (for example,
          # a firmware/keymap commit landed). Rebase the generated commit onto
          # the current remote head before pushing, so a harmless concurrent
          # commit does not cause a non-fast-forward failure.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
